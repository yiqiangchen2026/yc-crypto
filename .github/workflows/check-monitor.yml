name: Check volume monitor
on:
  push:
    paths: ['monitor/**', 'stock-monitor/**', '.github/workflows/check-monitor.yml']
  pull_request:
    paths: ['monitor/**', 'stock-monitor/**', 'site/volume/**', 'site/monitor/**', 'package*.json', '.github/workflows/check-monitor.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:monitor
