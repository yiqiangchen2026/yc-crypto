name: Collect trading volume
on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collect-trading-volume
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect and publish snapshot
        run: node scripts/collect-volume.mjs
        env:
          MONITOR_INGEST_URL: https://yc-volume-monitor.xlayer-wallet-report-worker.workers.dev/admin/ingest
          VOLUME_INGEST_TOKEN: ${{ secrets.VOLUME_INGEST_TOKEN }}
